<title>Andrew Lamppa</title>

<style>
  :root{
    --ink:#16161a;--muted:#6b6b73;--hair:#e6e4df;
    --paper:#faf9f6;--card:#ffffff;--accent:#1f3a52;--r:22px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
    background:var(--paper);color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    padding:24px;padding-top:max(24px,env(safe-area-inset-top));
    padding-bottom:max(24px,env(safe-area-inset-bottom));
    min-height:100vh;-webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%;max-width:380px;background:var(--card);
    border:1px solid var(--hair);border-radius:var(--r);
    padding:40px 32px 32px;
    box-shadow:0 1px 2px rgba(0,0,0,.03),0 12px 40px -12px rgba(0,0,0,.12);
  }
  .head{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;margin-bottom:22px;flex-wrap:wrap;
  }
  .avatar{
    width:88px;height:88px;border-radius:50%;object-fit:cover;
    border:1px solid var(--hair);flex:none;
  }
  .share{
    display:inline-flex;align-items:center;gap:7px;flex:none;
    background:none;border:1px solid var(--hair);border-radius:999px;
    padding:10px 15px;font-family:inherit;font-size:13px;font-weight:500;
    color:var(--ink);cursor:pointer;letter-spacing:-.01em;line-height:1;
    white-space:nowrap;
  }
  .share:active{opacity:.6;}
  .share svg{width:15px;height:15px;flex:none;}
  h1{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-bottom:6px;}
  .role{color:var(--muted);font-size:15px;line-height:1.4;margin-bottom:26px;}
  .role b{color:var(--ink);font-weight:500;}
  .rows{border-top:1px solid var(--hair);margin-bottom:26px;}
  .row{
    display:flex;align-items:center;gap:14px;padding:15px 2px;
    border-bottom:1px solid var(--hair);text-decoration:none;color:inherit;
  }
  .row:active{opacity:.55;}
  .row .ic{width:20px;flex:none;text-align:center;font-size:15px;color:var(--muted);}
  .row .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  .row .val{font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .stack{display:flex;flex-direction:column;gap:1px;min-width:0;}
  .chev{margin-left:auto;color:#c7c5bf;font-size:16px;}
  .save{
    display:block;width:100%;background:var(--accent);color:#fff;
    border:none;border-radius:14px;padding:16px;font-size:16px;font-weight:500;
    font-family:inherit;cursor:pointer;letter-spacing:-.01em;
  }
  .save:active{opacity:.8;}
  .qrwrap{margin-top:24px;display:flex;flex-direction:column;align-items:center;gap:12px;}
  .qrbox{padding:16px;background:#fff;border:1px solid var(--hair);border-radius:16px;}
  .qrbox img,.qrbox canvas{display:block;border-radius:4px;}
  .qrcap{color:var(--muted);font-size:12px;text-align:center;}
  @media (prefers-color-scheme:dark){
    :root{--ink:#f2f1ee;--muted:#9a9aa2;--hair:#2c2c30;--paper:#101012;--card:#1a1a1d;--accent:#4a7ba6;}
    .save{color:#fff;}
    .qrbox{background:#fff;}
  }
</style>
</head>

/* ======================== */

const $=id=>document.getElementById(id);
const fullName=(me.first+" "+me.last).trim();
$("name").textContent=fullName;
$("avatar").src=me.photoPage;
$("avatar").alt=fullName;
$("role").innerHTML=[me.title&&"<b>"+me.title+"</b>",me.company].filter(Boolean).join(" &middot; ");
document.title=fullName;

const tel=me.phone.replace(/[^\d+]/g,"");
const rows=[
  me.phone&&{ic:"\u2706",lab:"Phone",val:me.phone,href:"tel:"+tel},
  me.email&&{ic:"\u2709",lab:"Email",val:me.email,href:"mailto:"+me.email},
  me.website&&{ic:"\u2295",lab:"Website",val:me.website.replace(/^https?:\/\//,""),href:me.website},
  ...me.socials.map(s=>({ic:"\u2192",lab:s.label,val:s.url.replace(/^https?:\/\/(www\.)?/,""),href:s.url}))
].filter(Boolean);
$("rows").innerHTML=rows.map(r=>'<a class="row" href="'+r.href+'" '+(r.href.indexOf("http")===0?'target="_blank" rel="noopener"':'')+'><span class="ic">'+r.ic+'</span><span class="stack"><span class="lab">'+r.lab+'</span><span class="val">'+r.val+'</span></span><span class="chev">\u203a</span></a>').join("");

function vcard(){
  const photo=me.photoCard.match(/.{1,74}/g).join("\r\n ");
  const L=["BEGIN:VCARD","VERSION:3.0",
    "N:"+me.last+";"+me.first+";;;","FN:"+fullName,
    me.company&&"ORG:"+me.company, me.title&&"TITLE:"+me.title,
    me.phone&&"TEL;TYPE=CELL:"+me.phone,
    me.email&&"EMAIL;TYPE=INTERNET:"+me.email,
    me.website&&"URL:"+me.website,
    ...me.socials.map(s=>"URL;TYPE="+s.label+":"+s.url),
    "PHOTO;ENCODING=b;TYPE=JPEG:"+photo,
    "END:VCARD"].filter(Boolean);
  return L.join("\r\n");
}
$("save").addEventListener("click",function(){
  const blob=new Blob([vcard()],{type:"text/vcard;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=me.first+"_"+me.last+".vcf";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},1500);
});
new QRCode($("qrbox"),{text:location.href,width:200,height:200,colorDark:"#16161a",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});

$("share").addEventListener("click",function(){
  const url=location.href;
  const text="Here's my contact card: "+url;
  // Copy URL to clipboard (best-effort)
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).catch(function(){});}
  // Open Messages with the card link prefilled
  window.location.href="sms:&body="+encodeURIComponent(text);
});
</script>
